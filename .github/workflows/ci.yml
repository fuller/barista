name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: npm run eval:menu
      - run: npm run release:check
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run test:e2e
        env:
          OPENROUTER_API_KEY: ''
  deploy:
    name: Deploy production Worker
    needs: [verify, browser]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: cloudflare-production
      cancel-in-progress: false
    environment:
      name: production
      url: ${{ steps.deploy.outputs.deployment-url }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: npm
      - name: Check deployment credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo '::error::Set the CLOUDFLARE_API_TOKEN repository secret.'; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo '::error::Set the CLOUDFLARE_ACCOUNT_ID repository secret.'; exit 1; }
      - run: npm ci
      - name: Skip superseded commits
        id: freshness
        shell: bash
        run: |
          latest=$(git ls-remote --exit-code origin refs/heads/main | cut -f1)
          if [ "$latest" = "$GITHUB_SHA" ]; then
            echo 'current=true' >> "$GITHUB_OUTPUT"
          else
            echo 'current=false' >> "$GITHUB_OUTPUT"
            echo 'Newer main commit exists; skipping this deployment.'
          fi
      - name: Deploy Worker
        id: deploy
        if: steps.freshness.outputs.current == 'true'
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.162.0'
          packageManager: npm
          command: deploy
      - name: Check deployed app and live configuration
        if: steps.freshness.outputs.current == 'true'
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          node --input-type=module <<'JS'
          import {setTimeout} from 'node:timers/promises';
          const base = new URL(process.env.DEPLOYMENT_URL);
          if (base.protocol !== 'https:') throw new Error('Expected an HTTPS deployment URL');
          for (let attempt = 0; attempt < 5; attempt++) {
            try {
              for (const path of ['/', '/api/config', '/api/menu-directory']) {
                const response = await fetch(new URL(path, base), {signal: AbortSignal.timeout(15000)});
                if (!response.ok) throw new Error(`Smoke check failed: ${path} HTTP ${response.status}`);
                if (path === '/api/config' && !(await response.json()).liveAvailable) throw new Error('Live ordering is unavailable');
                if (path === '/api/menu-directory' && !(await response.json()).products?.length) throw new Error('Menu is empty');
                if (!response.bodyUsed) await response.body?.cancel();
              }
              console.log('App, live configuration and menu checks passed; no inference used.');
              break;
            } catch (error) {
              if (attempt === 4) throw error;
              await setTimeout(3000);
            }
          }
          JS
